<!DOCTYPE html>
<html lang="en">

<head>
  <title>Syncfusion PDF Viewer - Semantic Text Comparison</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Syncfusion PDF Viewer - Semantic Text Comparison">
  <meta name="author" content="Syncfusion">
  <!--Refer scripts and styles from CDN-->
  <script src="https://cdn.syncfusion.com/ej2/35.1.37/dist/ej2.min.js" type="text/javascript"></script>
  <link href="https://cdn.syncfusion.com/ej2/35.1.37/tailwind3.css" rel="stylesheet" />

  <script src="https://cdn.syncfusion.com/ej2/syncfusion-helper.js" type="text/javascript"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #container {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    #controlPanel {
      display: flex;
      gap: 8px;
      padding: 12px;
      background-color: #f5f5f5;
      border-bottom: 1px solid #ddd;
      flex-wrap: wrap;
      align-items: center;
      overflow-y: auto;
      max-height: 80px;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      color: white;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.8;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background-color: #007bff;
    }

    .btn-success {
      background-color: #28a745;
    }

    .btn-warning {
      background-color: #ffc107;
      color: black;
    }

    .btn-danger {
      background-color: #dc3545;
    }

    .btn-info {
      background-color: #17a2b8;
    }

    .btn-secondary {
      background-color: #6c757d;
    }

    .separator {
      width: 1px;
      height: 24px;
      background-color: #ccc;
      margin: 0 8px;
    }

    #viewersContainer {
      display: flex;
      flex: 1;
      gap: 0;
      overflow: hidden;
    }

    .viewer-section {
      width: 50%;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ccc;
    }

    .viewer-section:last-child {
      border-right: none;
    }

    .viewer-label {
      padding: 8px 12px;
      background-color: #e9ecef;
      border-bottom: 1px solid #ddd;
      font-weight: 600;
      font-size: 13px;
      color: #333;
    }

    .pdf-viewer {
      flex: 1;
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="container">
    <!-- Control Panel -->
    <div id="controlPanel"></div>

    <!-- PDF Viewers Container -->
    <div id="viewersContainer">
      <!-- Viewer 1 - Original Document -->
      <div class="viewer-section">
        <div class="viewer-label">Original Document</div>
        <div id="pdfViewer1" class="pdf-viewer"></div>
      </div>

      <!-- Viewer 2 - Modified Document -->
      <div class="viewer-section">
        <div class="viewer-label">Modified Document</div>
        <div id="pdfViewer2" class="pdf-viewer"></div>
      </div>
    </div>
  </div>

  <script>
    var ele = document.getElementById('container');
    if (ele) {
      ele.style.visibility = "visible";
    }
  </script>

  <script src="index.js" type="text/javascript"></script>
</body>

</html>
