<!DOCTYPE html>
<html lang="en">

<head>
    <title>EJ2 PDF Viewer - Barcode field</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JavaScript PDF Viewer Control">
    <meta name="author" content="Syncfusion">
    <link href="https://cdn.syncfusion.com/ej2/35.1.43/tailwind3.css" rel="stylesheet">

    <!-- Essential JS 2 PDF Viewer's script -->
    <script src="https://cdn.syncfusion.com/ej2/35.1.43/dist/ej2.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/syncfusion-helper.js" type="text/javascript"></script>

    <style>
        .barcode-toolbar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .barcode-toolbar h4 {
            width: 100%;
            margin: 0;
            font-size: 13px;
            font-weight: 600;
            color: #424242;
        }

        .barcode-toolbar button {
            padding: 6px 12px;
            font-size: 13px;
            color: #1b1b1b;
            background-color: #ffffff;
            border: 1px solid #b1b1b1;
            border-radius: 4px;
            cursor: pointer;
        }

        .barcode-toolbar button:hover:not(:disabled) {
            background-color: #e8f1fb;
            border-color: #0b6cbd;
        }

        .barcode-toolbar button:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .barcode-toolbar select {
            padding: 4px 6px;
            font-size: 13px;
            border: 1px solid #b1b1b1;
            border-radius: 4px;
        }

        .e-pv-barcode-caption {
            width: 100%;
            margin-top: 2px;
            font-family: monospace;
            font-size: 11px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div id="container">
        <div class="barcode-toolbar">
            <h4>Add barcode field programmatically</h4>
            <button id="addPdf417Barcode">Add PDF417</button>
            <button id="addQrCodeBarcode">Add QR Code</button>
            <button id="addDataMatrixBarcode">Add Data Matrix</button>
            <button id="enableBarcodeMode">Set Barcode Field Mode</button>
        </div>

        <div class="barcode-toolbar">
            <h4>Edit barcode field</h4>
            <select id="selectedField">
                <option value="">No barcode field</option>
            </select>
            <button id="updateSymbologyPdf417" disabled>Set PDF417</button>
            <button id="updateSymbologyQrCode" disabled>Set QR Code</button>
            <button id="updateSymbologyDataMatrix" disabled>Set Data Matrix</button>
            <button id="deleteSelectedField" disabled>Delete Field</button>
        </div>

        <div id="PdfViewer" style="height:680px;width:100%;"></div>
    </div>

    <script>
        var ele = document.getElementById('container');
        if (ele) {
            ele.style.visibility = "visible";
        }
    </script>
    <script src="index.js" type="text/javascript"></script>
</body>

</html>
