<!DOCTYPE html>
<html lang="en">

<head>
    <title>EJ2 PDF Viewer</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Typescript PDF Viewer Control">
    <meta name="author" content="Syncfusion">
    <link href="https://cdn.syncfusion.com/ej2/35.1.41/tailwind3.css" rel="stylesheet">

    <!-- Essential JS 2 PDF Viewer's script -->
    <script src="https://cdn.syncfusion.com/ej2/35.1.41/dist/ej2.min.js" type="text/javascript"></script>
    <script src="https://cdn.syncfusion.com/ej2/syncfusion-helper.js" type="text/javascript"></script>

</head>

<body>
    <div id="container">
        <div class="action-group">
            <h4>Set annotation mode for newly added annotations</h4>
            <button id="RectangleMode">Rectangle</button>
            <button id="CircleMode">Circle</button>
            <button id="PolygonMode">Polygon</button>
            <button id="FreeTextMode">Free Text</button>
            <button id="AreaMode">Area</button>
            <button id="LineMode">Line</button>
        </div>

        <div class="action-group">
            <h4>Exit annotation mode</h4>
            <button id="ExitAnnotationMode">Exit Annotation Mode</button>
        </div>

        <div class="action-group">
            <h4>Add annotations programmatically</h4>
            <button id="AddCloudRectangle">Cloud Rectangle</button>
            <button id="AddDashedCircle">Dashed Circle</button>
            <button id="AddCloudFreeText">Cloud Free Text</button>
            <button id="AddDashedLine">Dashed Line</button>
            <button id="AddCloudArea">Cloud Area</button>
            <button id="AddDashedRadius">Dashed Radius</button>
        </div>

        <div class="action-group">
            <h4>Modify existing annotation border</h4>
            <button id="ApplyCloudBorder">Apply Cloud Border</button>
            <button id="ApplyDashedBorder">Apply Dashed Border</button>
            <button id="ResetBorder">Reset To Solid</button>
        </div>

        <div id="PdfViewer" style="height:650px;width:100%;"></div>
    </div>

    <style>
        .action-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            margin-bottom: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
        }

        .action-group h4 {
            width: 100%;
            margin: 0 0 4px;
            font-size: 13px;
            font-weight: 600;
            color: #424242;
        }

        .action-group button {
            padding: 6px 12px;
            font-size: 13px;
            color: #1b1b1b;
            background: #ffffff;
            border: 1px solid #bdbdbd;
            border-radius: 4px;
            cursor: pointer;
        }

        .action-group button:hover {
            background: #f5f5f5;
            border-color: #1976d2;
        }

        .action-group button:focus-visible {
            outline: 2px solid #1976d2;
            outline-offset: 1px;
        }
    </style>

    <script>
        var ele = document.getElementById('container');
        if (ele) {
            ele.style.visibility = "visible";
        }   
    </script>
    <script src="index.js" type="text/javascript"></script>
</body>

</html>
