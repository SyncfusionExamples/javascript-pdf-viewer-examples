<!DOCTYPE html>
<html lang="en">

<head>
  <title>Syncfusion PDF Viewer - Collaborative Editing</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Syncfusion PDF Viewer with Collaborative Editing">
  <meta name="author" content="Syncfusion">

  <!-- Optional: CDN versions if local files not available -->
  <script src="https://cdn.syncfusion.com/ej2/35.1.37/dist/ej2.min.js" type="text/javascript"></script>
  <link href="https://cdn.syncfusion.com/ej2/35.1.37/tailwind3.css" rel="stylesheet" />

  <script src="https://cdn.syncfusion.com/ej2/syncfusion-helper.js" type="text/javascript"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    #container {
      height: 100%;
      width: 100%;
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
    }

    #collaborationStatusBar {
      padding: 10px 15px;
      background-color: #f0f0f0;
      border-bottom: 1px solid #ddd;
      font-size: 12px;
      flex-shrink: 0;
    }

    #PdfViewer {
      flex: 1;
      overflow: hidden;
    }
  </style>
</head>

<body>
  <div id="container"></div>

  <script>
    // Initialize visibility
    document.addEventListener('DOMContentLoaded', function () {
      const ele = document.getElementById('container');
      if (ele) {
        ele.style.visibility = "visible";
      }
    });
  </script>

  <!-- Load adapter first, then main app -->
  <script src="pdfViewerAdapter.js" type="text/javascript"></script>
  <script src="index.js" type="text/javascript"></script>
</body>

</html>
